<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ mode|title }} · FluentPath</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"><style>
body{min-height:100vh;display:grid;place-items:center;padding:22px;background:var(--bg)}.auth-card{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:34px;box-shadow:var(--shadow)}.auth-brand{font:800 25px Manrope;color:var(--text);margin-bottom:6px}.auth-sub{color:var(--muted);margin-bottom:24px}.auth-card label{display:block;font-weight:700;font-size:12px;margin:14px 0 7px}.auth-card input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--text)}.auth-btn{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:var(--purple);color:white;font-weight:800}.auth-error{background:#fff0f0;color:#b33;padding:10px;border-radius:9px;margin:12px 0;font-size:13px}.auth-foot{margin-top:20px;color:var(--muted);font-size:13px}.auth-foot a{color:var(--purple);font-weight:700}</style></head><body><main class="auth-card">
<div class="auth-brand">✦ FluentPath</div><div class="auth-sub">Your personal English learning space</div><h2>{{ 'Create your account' if mode=='signup' else 'Welcome back' }}</h2>
{% if error %}<div class="auth-error">{{ error }}</div>{% endif %}<form method="post">
{% if mode=='signup' %}<label>Display name</label><input name="display_name" maxlength="50" required placeholder="Your name">{% endif %}
<label>Username</label><input name="username" minlength="3" maxlength="40" required autocomplete="username" placeholder="Choose a username">
<label>Password</label><input type="password" name="password" minlength="6" required autocomplete="{{ 'new-password' if mode=='signup' else 'current-password' }}" placeholder="At least 6 characters">
<button class="auth-btn">{{ 'Create account' if mode=='signup' else 'Login' }}</button></form>
<div class="auth-foot">{% if mode=='signup' %}Already registered? <a href="{{ url_for('login') }}">Login</a>{% else %}New learner? <a href="{{ url_for('signup') }}">Create an account</a>{% endif %}</div></main></body></html>
